[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tigerdiag"
version = "0.2.0"
description = "Mac diagnostic CLI for Triumph Tiger motorcycles (Tiger 900 GT Pro)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
tigerdiag = "tigerdiag.cli:main"
tigerdiag-gui = "tigerdiag.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
