[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tigerdiag"
version = "0.1.0"
description = "Mac-friendly ELM327 diagnostic CLI for Triumph Tiger motorcycles"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
tigerdiag = "tigerdiag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

